name: BIMO AI Linux build artifacts

# Optional and currently unverified; Windows x64 is the supported release.
# Manual artifact build only, with no release or Git tag publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: bimo-linux-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: bimo-linux-
      - name: Install dependencies
        run: npm ci
      - name: Frontend checks
        run: |
          npx tsc --noEmit
          npm test
      - name: Native tests
        run: |
          cargo build --release --locked -p coucou-hook
          cargo test --workspace --locked
      - name: Build and collect artifact names
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: BIMOAI-Linux-unverified-installers
          path: |
            windows/release/BIMOAI-Linux-*
            windows/release/release-manifest.json
            windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
