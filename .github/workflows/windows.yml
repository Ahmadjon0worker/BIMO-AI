name: Windows build artifacts

# Manual build only. This workflow cannot publish releases or move Git tags.
# EXE/MSI include the verified service runtime; a bare executable pair does not.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Fetch pinned runtime from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .build-inputs -Force | Out-Null
          gh release download v0.7.1 --repo $env:GITHUB_REPOSITORY --pattern 'BIMOAI-Windows-runtime-base.zip' --dir .build-inputs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime base download failed.' }
          python scripts/prepare-release-runtime.py --archive .build-inputs/BIMOAI-Windows-runtime-base.zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime verification failed.' }

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-build-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Build the relay
        run: cargo rustc --release --locked -p coucou-hook -- -C target-feature=+crt-static

      - name: Native tests
        run: cargo test --workspace --locked

      # Tauri supplies WiX while bundling; the extractor also needs the
      # GitHub Windows runner's normal 7-Zip installation.
      - name: Check installer extraction prerequisite
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\7-Zip\7z.exe')) {
            throw 'Installer verification requires 7-Zip.'
          }

      - name: Build and verify installers
        run: npm run pack

      - name: Collect installer verification report
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath release/release-manifest.json -Raw | ConvertFrom-Json
          if (-not $manifest.verification.file) { throw 'Installer verification report is missing.' }
          Copy-Item -LiteralPath $manifest.verification.file -Destination release/installer-verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: BIMOAI-Windows-verified-installers
          path: |
            windows/release/BIMOAI-Windows-*-setup.exe
            windows/release/BIMOAI-Windows-*.msi
            windows/release/release-manifest.json
            windows/release/SHA256SUMS.txt
            windows/release/installer-verification.json
            windows/INSTALL-UZ.md
          if-no-files-found: error
          retention-days: 3
