name: Windows CI

# Automatic checks do not download or require the large release runtime.
# Native tests are opt-in and require the pinned v0.6.2 runtime asset to exist.
on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:
    inputs:
      native:
        description: 'Also hydrate the public runtime and run native Rust tests'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Prepare verified public runtime
        run: python scripts/prepare-release-runtime.py --download

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-native-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-native-${{ runner.os }}-

      # The app's generated Tauri context requires the relay resource.
      - name: Build the relay
        run: cargo rustc --release --locked -p coucou-hook -- -C target-feature=+crt-static

      - name: Native tests
        run: cargo test --workspace --locked
